name: Bug report
description: Something in the extension or the bundled CPN IDE does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally including the `.cpn` model or a snippet of it if relevant.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - linux-x64
        - win32-x64
        - macos
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in the Extensions view, or in `package.json`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Copy the output from the "CPN IDE" output channel
        (View > Output, then select "CPN IDE" in the dropdown). Remove anything sensitive.
      render: text
