name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Cache CPN installer
        uses: actions/cache@v4
        with:
          path: .cache
          key: cpn-installer-${{ hashFiles('scripts/fetch-cpn.sh') }}

      - name: Install innoextract
        run: |
          sudo apt-get update
          sudo apt-get install -y innoextract

      - name: Fetch CPN IDE binaries
        run: scripts/fetch-cpn.sh

      - run: npm run build

      - name: Package VSIX (linux-x64, win32-x64)
        run: |
          mkdir -p dist-vsix
          npx @vscode/vsce package --no-dependencies --target linux-x64 -o dist-vsix/
          npx @vscode/vsce package --no-dependencies --target win32-x64 -o dist-vsix/

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-vsix/*.vsix
          fail_on_unmatched_files: true

  # Disabled until a Marketplace publisher exists and the VSCE_PAT secret
  # (Azure DevOps PAT, scope Marketplace > Manage) is configured. Remove `if: false` to enable.
  publish-marketplace:
    name: publish-marketplace
    if: ${{ false }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist-vsix
      - name: Publish to the VS Code Marketplace
        run: |
          for f in dist-vsix/*.vsix; do
            npx @vscode/vsce publish --packagePath "$f"
          done
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
