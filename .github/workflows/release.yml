name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Cache CPN installer
        uses: actions/cache@v6
        with:
          path: .cache
          key: cpn-installer-19084e923258681b809e80b5a5c1944da6b7f072397d1194a26689b46a9b879a

      - name: Install innoextract
        run: |
          sudo apt-get update
          sudo apt-get install -y innoextract gcc-multilib

      - name: Fetch CPN IDE binaries
        run: scripts/fetch-cpn.sh
        env:
          REQUIRE_SOCKSHIM: "1"

      - run: npm run build

      - name: Package VSIX (linux-x64, win32-x64)
        run: |
          mkdir -p dist-vsix
          npx @vscode/vsce package --no-dependencies --target linux-x64 -o dist-vsix/
          npx @vscode/vsce package --no-dependencies --target win32-x64 -o dist-vsix/

      - name: Check the socket shim is in the linux-x64 VSIX
        run: unzip -l dist-vsix/*linux-x64*.vsix | grep -q 'resources/backend/shim/x86_64/libsockshim.so'

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error

      # The release notes are this version's CHANGELOG.md section; GitHub appends the list of merged PRs.
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: dist-vsix/*.vsix
          fail_on_unmatched_files: true

  # Publishes the release VSIX files. Each store is opt-in through a repository variable, so a
  # missing token never fails the release:
  #   VS Code Marketplace: variable PUBLISH_MARKETPLACE=true, secret VSCE_PAT
  #     (Azure DevOps PAT, organization "All accessible organizations", scope Marketplace > Manage).
  #   Open VSX (VSCodium, Cursor, ...): variable PUBLISH_OPENVSX=true, secret OVSX_PAT (open-vsx.org access token).
  publish:
    name: publish
    if: vars.PUBLISH_MARKETPLACE == 'true' || vars.PUBLISH_OPENVSX == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist-vsix
      - name: Publish to the VS Code Marketplace
        if: vars.PUBLISH_MARKETPLACE == 'true'
        run: npx --yes @vscode/vsce publish --skip-duplicate --packagePath dist-vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: vars.PUBLISH_OPENVSX == 'true'
        run: |
          for f in dist-vsix/*.vsix; do
            npx --yes ovsx publish "$f" --skip-duplicate
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
