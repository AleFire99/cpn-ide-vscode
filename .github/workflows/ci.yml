name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Download the 187 MB installer from cpnide.org once per run (cached across runs by
  # its SHA-256) and hand it to the other jobs as an artifact.
  fetch-installer:
    name: fetch-installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CPN_INSTALLER_SHA256: 19084e923258681b809e80b5a5c1944da6b7f072397d1194a26689b46a9b879a
    steps:
      - uses: actions/checkout@v7
      - name: Cache CPN installer
        id: cache
        uses: actions/cache@v6
        with:
          path: .cache/cpn-ide-1.24.1031.setup.exe
          key: cpn-installer-${{ env.CPN_INSTALLER_SHA256 }}
      - name: Download installer
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/fetch-cpn.sh --download-only
      - name: Verify checksum
        run: echo "$CPN_INSTALLER_SHA256  .cache/cpn-ide-1.24.1031.setup.exe" | sha256sum -c
      - uses: actions/upload-artifact@v7
        with:
          name: cpn-installer
          path: .cache/cpn-ide-1.24.1031.setup.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  lint-test:
    name: lint-test
    needs: fetch-installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Download CPN installer
        uses: actions/download-artifact@v8
        with:
          name: cpn-installer
          path: .cache
      - name: Install system packages (innoextract, xvfb)
        # A stalled mirror once cost 9 min: give each attempt a deadline and retry.
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y innoextract xvfb gcc-multilib && exit 0
            echo "apt attempt $i failed, retrying"
          done
          exit 1

      - name: Fetch CPN IDE binaries
        run: scripts/fetch-cpn.sh
        env:
          REQUIRE_SOCKSHIM: "1"

      - name: VS Code integration test
        run: npm run test:integration

  # The 32-bit CPN simulator does not start on GitHub-hosted VMs (its SML heap image
  # fails to load), but works in this container, the same base as docker/Dockerfile.
  # Docker >= 29's default seccomp profile blocks the i386 socketcall(2) the simulator's glibc uses (#119);
  # the container runs under the default profile and relies on the shim scripts/build-sockshim.sh builds (#126).
  # The simulator always binds port 20001, which stays in TIME-WAIT ~60 s after it stops, so in one job the
  # real-backend files run one at a time and mostly wait. Each shard has its own container network instead.
  backend-it-shard:
    name: backend-it (${{ matrix.shard }})
    needs: fetch-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: backend-start
            args: test/unit/backend.integration.test.ts -t "starts, binds"
          - shard: backend-foreign
            args: test/unit/backend.integration.test.ts -t "detects a foreign"
          - shard: backend-overlap
            args: test/unit/backend.integration.test.ts -t "survives overlapping"
          - shard: headless-race
            args: test/unit/headless-race.integration.test.ts
          - shard: init-proxy
            args: test/unit/init-proxy.integration.test.ts
          - shard: examples
            args: test/unit/examples.integration.test.ts
          - shard: explore
            args: test/unit/explore.integration.test.ts
          - shard: rest
            args: --exclude "test/unit/*.integration.test.ts"
    container:
      image: eclipse-temurin:17-jre-jammy
    steps:
      - name: Install system packages
        run: |
          for i in 1 2 3; do
            timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ca-certificates curl innoextract libc6-i386 git zip unzip gcc gcc-multilib && exit 0
            echo "apt attempt $i failed, retrying"
          done
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download CPN installer
        uses: actions/download-artifact@v8
        with:
          name: cpn-installer
          path: .cache
      - name: Fetch CPN IDE binaries
        run: scripts/fetch-cpn.sh
        env:
          REQUIRE_SOCKSHIM: "1"
      - name: Backend integration test
        run: npx vitest run ${{ matrix.args }}
        env:
          CPN_IT: "1"

  # The required check: passes only when every shard passed.
  backend-it:
    name: backend-it
    needs: backend-it-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.backend-it-shard.result }}" = success

  build-vsix:
    name: build-vsix
    needs: fetch-installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download CPN installer
        uses: actions/download-artifact@v8
        with:
          name: cpn-installer
          path: .cache
      - name: Install innoextract
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y innoextract gcc-multilib && exit 0
            echo "apt attempt $i failed, retrying"
          done
          exit 1

      - name: Fetch CPN IDE binaries
        run: scripts/fetch-cpn.sh
        env:
          REQUIRE_SOCKSHIM: "1"

      - run: npm run build

      - name: Package VSIX (linux-x64, win32-x64)
        run: |
          mkdir -p dist-vsix
          npx @vscode/vsce package --no-dependencies --target linux-x64 -o dist-vsix/
          npx @vscode/vsce package --no-dependencies --target win32-x64 -o dist-vsix/
          ls -l dist-vsix

      - name: Check the socket shim is in the linux-x64 VSIX
        run: unzip -l dist-vsix/*linux-x64*.vsix | grep -q 'resources/backend/shim/x86_64/libsockshim.so'

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error
